<body>

const app=document.querySelector('#app');let view=sessionStorage.getItem('bfc_view')||'customer';document.body.classList.add('login-locked');
const views={
customer:`<section class="panel"><h2>Menu</h2><p class="sub">Choose a dish and servings. Cost and ingredients scale with servings.</p><div class="notice">Menu items will appear here when the admin adds them.</div></section><section class="panel"><h2>Your order</h2><form id="order"><label for="dish">Dish</label><select id="dish" required><option value="">Choose a dish</option><option>Today's special (demo)</option></select><div class="two"><div><label for="servings">Servings</label><input id="servings" type="number" min="1" value="1" required></div><div><label for="name">Name</label><input id="name" placeholder="Your name" required></div></div><label for="note">Note (optional)</label><textarea id="note" placeholder="Any special request"></textarea><button class="primary">Place order</button><p class="sub" id="orderMsg" aria-live="polite"></p></form></section>`,
admin:`<section class="panel"><h2>Main Admin — Food Carts</h2><p class="sub">Create and manage separate food-cart businesses. Requires the multi-cart Supabase migration and platform-admin setup.</p><form id="cartCreateForm"><label for="cartName">Food cart name</label><input id="cartName" required maxlength="80" placeholder="e.g. Babita Veg Cart"><label for="cartDescription">Description</label><input id="cartDescription" maxlength="240" placeholder="Optional"><button class="primary" type="submit">＋ Create Food Cart</button></form><p id="cartStatus" class="notice" aria-live="polite">Cloud cart management is ready after the Supabase migration is applied.</p><div id="cartList"></div></section><section class="panel"><h2>Admin Dashboard</h2><p class="sub">Manage ration stock and build recipes with automatic ingredient costing.</p><div class="notice">This first screen saves in this browser only. Cloud sync/login is the next connection step.</div><details class="admin-tools"><summary>📦 Ingredients / Ration Store</summary><div class="admin-tool-content"><h3 class="section-title">Ration Store — Add / Update Ingredient</h3><form id="ingredientForm"><label>Ingredient name</label><input id="ingName" required placeholder="Rice, oil, potato…"><div class="two"><div><label>Unit</label><select id="ingUnit"><option>kg</option><option>g</option><option>litre</option><option>ml</option><option>piece</option></select></div><div><label>Stock quantity</label><input id="ingStock" type="number" min="0" step="0.001" required></div></div><div class="two"><div><label>Purchase rate per unit (₹)</label><input id="ingRate" type="number" min="0" step="0.01" required></div><div><label>Low-stock alert at</label><input id="ingLow" type="number" min="0" step="0.001" value="1"></div></div><button class="primary">Save ingredient</button></form><label for="stockSearch">Search ingredients</label><input id="stockSearch" placeholder="Search ration stock…"><div id="ingredientSummary" class="notice"></div><div id="ingredientList"></div></div></details><details class="admin-tools"><summary>🛒 Purchase</summary><div class="admin-tool-content"><p class="sub">Purchase entry area — record purchases here when the purchase workflow is connected.</p><div class="notice">Purchase records are not connected yet.</div></div></details></section><section class="panel"><h2>Recipe Builder</h2><form id="recipeForm"><label>Recipe name</label><input id="recipeName" required placeholder="e.g. Veg thali"><div class="two"><div><label>Base servings</label><input id="recipeServings" type="number" min="1" value="1" required></div><div><label>Selling price per serving (₹)</label><input id="recipePrice" type="number" min="0" step="0.01" value="0" required></div></div><label>Ingredients (select from Ration Store)</label><div id="recipeIngredients"></div><div id="recipeCostSummary" class="recipe-summary">Estimated cost / serving: ₹0.00</div><div class="recipe-actions"><button type="button" class="primary" id="addRecipeIngredient">＋ Add ingredient</button><button class="primary">Save recipe</button></div></form><div id="recipeList"></div></section><section class="panel"><h2>Orders</h2><p class="sub">Order queue connection is next.</p></section>`,
ration:`<section class="panel"><h2>Ration & Purchase</h2><p class="sub">Low-stock alerts, stock details, purchase, edit and delete. Changes are saved in this browser.</p><label for="rationSearch">Search ration items</label><input id="rationSearch" placeholder="Search items…"><div id="rationSummary" class="notice"></div><div id="rationList"></div></section>`,

async function setupCartManagement(){const form=document.querySelector('#cartCreateForm'),status=document.querySelector('#cartStatus'),list=document.querySelector('#cartList');if(!form||!supabaseClient)return;const slugify=v=>v.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);async function load(){status.textContent='Loading food carts from Supabase…';const {data,error}=await supabaseClient.from('food_carts').select('id,name,slug,description,is_active,created_at').order('created_at',{ascending:false});if(error){status.textContent='Could not load carts: '+error.message+' — confirm migration and platform-admin setup.';return}status.textContent=data.length+' food cart(s) in cloud.';list.innerHTML=data.map(c=>'<article class="ration-item"><b>'+String(c.name).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))+'</b><p>Slug: '+c.slug+' · '+(c.is_active?'Active':'Inactive')+'</p><button class="primary" type="button" data-cart-toggle="'+c.id+'" data-active="'+c.is_active+'">'+(c.is_active?'Deactivate':'Activate')+'</button></article>').join('')||'<p class="sub">No carts created yet.</p>'}form.onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#cartName').value.trim(),description=document.querySelector('#cartDescription').value.trim(),slug=slugify(name);if(!slug){status.textContent='Enter a valid cart name.';return}status.textContent='Creating cart…';const {data:{user}}=await supabaseClient.auth.getUser();const {error}=await supabaseClient.from('food_carts').insert({name,slug,description,created_by:user?.id||null});if(error){status.textContent='Create failed: '+error.message;return}form.reset();await load()};list.onclick=async e=>{const b=e.target.closest('[data-cart-toggle]');if(!b)return;const active=b.dataset.active!=='true';const {error}=await supabaseClient.from('food_carts').update({is_active:active}).eq('id',b.dataset.cartToggle);if(error){status.textContent='Update failed: '+error.message;return}await load()};await load()}\nfunction render(){sessionStorage.setItem('bfc_view',view);app.innerHTML=views[view==='recipe'?'admin':view];const panels=app.querySelectorAll('.panel');if(view==='admin'&&panels[1]){panels[1].hidden=true;}if(view==='recipe'){panels.forEach((p,i)=>{if(i!==1)p.hidden=true});if(panels[1]){panels[1].hidden=false;panels[1].classList.add('recipe-maker');const h=panels[1].querySelector('h2');if(h)h.textContent='Recipe Maker';}}document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const form=document.querySelector('#order');if(form)form.addEventListener('submit',e=>{e.preventDefault();document.querySelector('#orderMsg').textContent='Demo only: order is not sent or saved yet.'});if(view==='admin'||view==='recipe') setupAdmin();if(view==='admin'&&adminSession)setupCartManagement();if(view==='recipesLibrary') setupLibrary();if(view==='ration') setupRationPage();document.querySelector('#cookSave')?.addEventListener('click',()=>document.querySelector('#cookMsg').textContent='Demo only: status is not saved.');document.querySelector('#send')?.addEventListener('click',()=>document.querySelector('#msgStatus').textContent='Demo only: message is not sent.')}

const authModal=document.querySelector('#authModal'),authForm=document.querySelector('#authForm'),authMessage=document.querySelector('#authMessage'),authLoginOpen=document.querySelector('#adminLoginOpen'),authClose=document.querySelector('#authClose'),authLogout=document.querySelector('#authLogout'),cloudStatus=document.querySelector('#cloudStatus');let adminSession=null;function authNote(message,ok=false){authMessage.textContent=message;authMessage.style.background=ok?'#dff5e7':'#fff0ef';authMessage.style.color=ok?'#145b3c':'#9b2525'}function openAuth(){authModal.classList.add('open');document.body.classList.add('login-locked');authMessage.textContent='';document.querySelector('#authPassword').focus()}authLoginOpen.addEventListener('click',openAuth);authForm.addEventListener('submit',async e=>{e.preventDefault();if(!supabaseClient){authNote('Supabase library did not load. Check internet and refresh.');return}const email=document.querySelector('#authEmail').value.trim().toLowerCase(),password=document.querySelector('#authPassword').value;if(email!==ADMIN_EMAIL){authNote('This email is not authorized as the Admin account.');return}authNote('Signing in…',true);try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){authNote('Login failed: '+error.message);return}if(!data.session){authNote('Login did not return a session. Check Supabase Auth settings.');return}adminSession=data.session;}catch(err){authNote('Login request error: '+(err?.message||String(err)));return}authNote('✓ Admin login successful: '+email,true);authLogout.hidden=false;cloudStatus.textContent='☁ Admin connected';document.querySelector('.adminline strong').innerHTML='<span class="gold">ADMIN:</span> '+email;document.querySelector('.status').textContent='● Login status: Signed in';setTimeout(()=>{authModal.classList.remove('open');document.body.classList.remove('login-locked')},700)});authLogout.addEventListener('click',async()=>{const {error}=await supabaseClient.auth.signOut();if(error){authNote('Sign out failed: '+error.message);return}adminSession=null;authLogout.hidden=true;cloudStatus.textContent='● Local mode';document.querySelector('.adminline strong').innerHTML='<span class="gold">ADMIN:</span> Not Set';document.querySelector('.status').textContent='● Login status: Ready';authNote('✓ Signed out',true);openAuth()});if(supabaseClient){supabaseClient.auth.getSession().then(({data})=>{if(data.session&&data.session.user.email?.toLowerCase()===ADMIN_EMAIL){adminSession=data.session;authModal.classList.remove('open');document.body.classList.remove('login-locked');cloudStatus.textContent='☁ Admin connected';document.querySelector('.adminline strong').innerHTML='<span class="gold">ADMIN:</span> '+ADMIN_EMAIL;document.querySelector('.status').textContent='● Login status: Signed in';authLogout.hidden=false}})}
let deferredInstallPrompt=null;const installButton=document.querySelector('#installApp');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.hidden=false});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.textContent='✓ App Installed'});installButton.addEventListener('click',async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}else{installButton.textContent='Open browser menu ⋮ → Add to Home screen'}});if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));const menuToggle=document.querySelector('#menuToggle'),pageMenu=document.querySelector('#pageMenu');menuToggle.addEventListener('click',()=>{const open=pageMenu.classList.toggle('open');menuToggle.setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!event.target.closest('.menu-wrap')){pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false')}});pageMenu.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.page;pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'})}));document.querySelector('#update').addEventListener('click',()=>location.reload());function tickHeader(){const now=new Date();document.querySelector('#clock').textContent='🕒 '+now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});document.querySelector('#today').textContent='📅 '+now.toLocaleDateString([],{day:'2-digit',month:'2-digit',year:'numeric'})}tickHeader();setInterval(tickHeader,1000);render();if(sessionStorage.getItem('bfc_scroll'))requestAnimationFrame(()=>window.scrollTo(0,+sessionStorage.getItem('bfc_scroll')));window.addEventListener('pagehide',()=>sessionStorage.setItem('bfc_scroll',String(window.scrollY)));
</script></body></html>
