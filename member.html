<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062c20"><title>SABKA HISSA · Member Login</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#0b6948,#062d21 48%,#031b14);color:#e7f5eb;font:15px system-ui,Arial}.wrap{max-width:760px;margin:0 auto;padding:24px 14px 50px}.brand{text-align:center;padding:15px;border:1px solid #c9a74e;border-radius:20px;background:#092d22}.brand h1{margin:0;color:#f0d78d;letter-spacing:1px}.brand p{margin:5px 0 0;color:#a9cdb8}.panel{margin-top:16px;padding:18px;border:1px solid #52775f;border-radius:18px;background:linear-gradient(145deg,#153a2c,#0b281e);box-shadow:0 8px 22px #0005}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#c6e5d1;font-weight:700}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid #52775f;background:#061e16;color:#fff;font-size:16px}.btn{padding:11px 16px;border-radius:11px;border:1px solid #c9a74e;background:#0b7650;color:white;font-weight:800}.btn.secondary{background:#173d2e}.muted{color:#9db7aa}.hidden{display:none!important}.stat{padding:12px;border:1px solid #52775f;border-radius:12px;margin:8px 0;background:#0b281e}.stat b{color:#f0d78d}.data{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.error{color:#ffaaa0}.success{color:#8de0b7}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./member-config.js"></script></head>
<body><main class="wrap"><header class="brand"><h1>SABKA HISSA</h1><p>Member Secure Portal · सदस्य खाता</p></header>

<section id="login" class="panel"><h2>Member Login</h2><p class="muted">Admin ले दिएको Username र Password प्रयोग गर्नुहोस्।</p><div class="field"><label>Username</label><input id="username" type="text" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Sign In</button><p id="loginMsg" class="muted"></p></section>
<section id="portal" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="memberName">Member</h2><p class="muted">तपाईंको निजी खाता</p></div><button class="btn secondary" id="logoutBtn">Logout</button></div><div id="memberData"></div></div><section class="panel" id="memberChat"><h2>✉ Admin संदेश</h2><p class="muted">Admin के साथ निजी बातचीत</p><div id="memberChatList" class="chat-list"><p class="muted">Login के बाद संदेश दिखेंगे।</p></div><div class="field"><label>अपना संदेश</label><textarea id="memberMessage" rows="3" placeholder="Message / Reply लिखें..." style="width:100%;padding:12px;border-radius:11px;border:1px solid #52775f;background:#061e16;color:#fff;font:inherit"></textarea></div><div class="field"><label>Photo (optional)</label><input id="memberPhoto" type="file" accept="image/*"></div><button class="btn" id="sendMemberMessage">Send Message</button><p id="chatMsg" class="muted"></p></section></section>
</main>
<script>
let savedConfig={};let client=null;let currentMember=null;let currentUser=null;let chatChannel=null;
const $=id=>document.getElementById(id);
function showError(msg){$('loginMsg').textContent=msg;$('loginMsg').className='error'}
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderValue(label,value){return '<div class="stat"><b>'+esc(label)+'</b><div class="data">'+esc(typeof value==='object'?JSON.stringify(value,null,2):value)+'</div></div>'}
function initClient(){if(!savedConfig.url||!savedConfig.key)throw new Error('Member portal configuration उपलब्ध छैन। Admin लाई सम्पर्क गर्नुहोस्।');if(!window.supabase?.createClient)throw new Error('Supabase library load भएन। Internet जाँच गर्नुहोस्।');client=window.supabase.createClient(savedConfig.url,savedConfig.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sabka-hissa-member-auth-v1'}})}
async function loadPortal(user){const {data:link,error:linkError}=await client.from('member_login_accounts').select('member_id,member_name,is_active').eq('auth_user_id',user.id).eq('is_active',true).maybeSingle();if(linkError||!link)throw new Error('यो Login सक्रिय Member खातासँग जोडिएको छैन। Admin लाई सम्पर्क गर्नुहोस्।');currentMember=link;currentUser=user;const {data,error}=await client.from('member_portal_data').select('member_data').eq('member_id',link.member_id).maybeSingle();if(error||!data)throw new Error('तपाईंको खाता विवरण अहिले उपलब्ध छैन।');$('memberName').textContent=link.member_name;$('memberData').innerHTML=Object.entries(data.member_data||{}).map(([k,v])=>renderValue(k,v)).join('')||'<p class="muted">अहिले कुनै विवरण छैन।</p>';$('login').classList.add('hidden');$('portal').classList.remove('hidden');await loadMemberMessages();startMemberRealtime()}
async function loadMemberMessages(){if(!currentMember)return;const {data,error}=await client.from('member_messages').select('*').eq('member_id',String(currentMember.member_id)).order('created_at',{ascending:true});if(error)throw error;const rows=data||[];const html=await Promise.all(rows.map(async x=>{let photo='';if(x.photo_path){const {data}=await client.storage.from('member-chat-photos').createSignedUrl(x.photo_path,3600);photo=data?.signedUrl||''}return '<article class="stat"><b>'+(x.sender_role==='admin'?'Admin':'You')+'</b><div class="data">'+esc(x.body||'')+'</div>'+(photo?'<img src="'+esc(photo)+'" style="max-width:100%;max-height:220px;border-radius:10px;margin-top:8px" alt="Chat photo">':'')+'<small class="muted">'+esc(new Date(x.created_at).toLocaleString())+'</small></article>'}));$('memberChatList').innerHTML=html.join('')||'<p class="muted">अहिलेसम्म कुनै सन्देश छैन।</p>'}
function startMemberRealtime(){if(chatChannel)client.removeChannel(chatChannel);chatChannel=client.channel('member-chat-'+currentMember.member_id).on('postgres_changes',{event:'*',schema:'public',table:'member_messages',filter:'member_id=eq.'+String(currentMember.member_id)},()=>loadMemberMessages().catch(e=>$('chatMsg').textContent=e.message)).subscribe()}
async function compressPhoto(file){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('Image file chunein');const url=URL.createObjectURL(file),img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});let blob=null,max=1280,q=.78;for(let i=0;i<7;i++){const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob&&blob.size<450*1024)break;max=Math.round(max*.82);q=Math.max(.48,q-.06)}URL.revokeObjectURL(url);if(!blob||blob.size>500*1024)throw new Error('Photo 500 KB से कम नहीं हुई।');return blob}
async function sendMemberMessage(){const body=$('memberMessage').value.trim(),file=$('memberPhoto').files[0];if(!body&&!file){$('chatMsg').textContent='Message लिखें या photo चुनें।';return}const btn=$('sendMemberMessage');btn.disabled=true;$('chatMsg').textContent='Sending…';try{let photo_path=null;if(file){const blob=await compressPhoto(file),path=String(currentMember.member_id)+'/'+crypto.randomUUID()+'.jpg';const {error}=await client.storage.from('member-chat-photos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;photo_path=path}const {error}=await client.from('member_messages').insert({member_id:String(currentMember.member_id),sender_user_id:currentUser.id,sender_role:'member',body,photo_path});if(error){if(photo_path)await client.storage.from('member-chat-photos').remove([photo_path]);throw error}$('memberMessage').value='';$('memberPhoto').value='';$('chatMsg').textContent='संदेश भेज दिया गया।';await loadMemberMessages()}catch(e){$('chatMsg').textContent='भेजा नहीं गया: '+(e.message||e)}finally{btn.disabled=false}}
$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;try{if(!client)initClient();const username=$('username').value.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(username))throw new Error('सही Username लिख्नुहोस्।');const {data,error}=await client.auth.signInWithPassword({email:username+'@members.sabka-hissa.invalid',password:$('password').value});if(error)throw error;await loadPortal(data.user)}catch(e){showError(e.message||'Login असफल भयो।')}finally{b.disabled=false}};
$('logoutBtn').onclick=async()=>{await client.auth.signOut();currentMember=null;currentUser=null;$('portal').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
$('sendMemberMessage').onclick=sendMemberMessage;
savedConfig=window.SABKA_HISSA_MEMBER_CONFIG||JSON.parse(localStorage.getItem('sabkaHissaSupabaseConfigV1')||'{}');
try{initClient();$('loginMsg').textContent='Admin ले दिएको Username र Password प्रयोग गरेर Login गर्नुहोस्।';}catch(e){showError(e.message)}
if(client)client.auth.getSession().then(({data})=>{if(data.session)loadPortal(data.session.user).catch(e=>showError(e.message))});
</script></body></html>
